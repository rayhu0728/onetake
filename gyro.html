<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="跟拍練習">
<title>跟拍練習</title>
<style>
  :root {
    --bg:#F4F5F7; --panel:#FFFFFF; --line:#D9DDE3; --text:#1B1E24; --muted:#4B5260;
    --accent:#1D4ED8; --on-accent:#FFFFFF; --accent-soft:#E3EAFB;
    --go:#1D4ED8; --good:#067647; --good-soft:#DDF3E6; --warn:#B54708; --warn-soft:#FDEBD3;
    --bad:#B42318; --bad-soft:#FDE4E1; --miss:#667085; --miss-soft:#ECEEF2; --stage:#0E1013;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#14171C; --panel:#1E2229; --line:#333A44; --text:#E8EAEE; --muted:#A3ABB7;
    --accent:#7FA8FF; --on-accent:#0B1220; --accent-soft:#22304D;
    --go:#2F5FD0; --good:#6FD39A; --good-soft:#173726; --warn:#FFB061; --warn-soft:#3A2A16;
    --bad:#FF8A7A; --bad-soft:#3D1F1C; --miss:#98A2B3; --miss-soft:#262B33; --stage:#000000;
  } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  main { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  section { width: 100%; max-width: 760px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  h1 { margin: 0; font-size: 26px; line-height: 1.3; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  button, .pick { font: inherit; font-weight: 700; min-height: 52px; padding: 0 20px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-size: 19px; min-width: 180px; }
  button.link { border: none; background: none; color: var(--accent); min-height: 44px; }
  button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  button:disabled { opacity: 0.45; cursor: default; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .status { min-height: 1.4em; font-size: 15px; color: var(--warn); }
  .ico { width: 22px; height: 22px; flex: none; }

  /* 俯視示意圖（src/gyro/pict.js） */
  .pict { width: 100%; height: 100%; display: block; }
  .pict-floor { fill: none; stroke: var(--line); stroke-width: 3; stroke-dasharray: 4 8; }
  .pict-cone { fill: var(--accent); opacity: 0.2; }
  .pict-phone { fill: var(--accent); }
  .pict-head { fill: var(--muted); }
  .pict-body { fill: none; stroke: var(--muted); stroke-width: 9; stroke-linecap: round; }

  /* 開始頁 */
  .song { font-size: 18px; font-weight: 700; }
  .counts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 480px; }
  .counts figure { margin: 0; padding: 8px 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .counts .arrow-box { width: 52px; height: 52px; margin: 4px 0; }
  .counts figcaption { font-size: 14px; font-weight: 700; }
  .counts b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 480px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
  .step b { color: var(--text); font-size: 15px; }
  .step-badge { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; border: 3px solid var(--line); }
  .step-badge.count { border-color: var(--accent); border-right-color: var(--line); border-bottom-color: var(--line); color: var(--accent); }
  .step-badge.go { background: var(--go); border-color: var(--go); color: #FFFFFF; }
  .step-badge.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .video-box { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pick input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .video-info { font-size: 15px; font-weight: 700; min-height: 1.5em; }
  .video-info.ok { color: var(--good); }
  .video-info.warn { color: var(--warn); }
  .tip { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }

  /* 練習中：提示疊在影片上，小、半透明、在畫面中間偏下（2026-10-31 Ray 從草稿選定）。
     每種動作一個顏色：推近橘（往上＝往前）、拉遠藍（往下＝往後）、左右搖紫。圈跑滿那一刻箭頭發亮往動作方向衝，那一側的邊緣跟著亮 */
  #run { max-width: 980px; gap: 8px; }
  .topbar { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .score { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--good); }
  .score small { color: var(--muted); font-size: 15px; font-weight: 700; }
  .icon-btn { width: 52px; min-width: 52px; padding: 0; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 70dvh; background: #0E1013; border-radius: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center; container-type: size; --c: #FFFFFF; }
  .stage video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .clock-face { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: #FFFFFF; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; opacity: 0.6; }
  .arrow-box { display: flex; }
  .arrow-box .arrow { display: block; width: 100%; height: 100%; }
  .cue { position: absolute; left: 50%; top: 60%; width: 29cqh; height: 29cqh; transform: translate(-50%, -50%); opacity: 0.6; color: var(--c); pointer-events: none; }
  .cue[data-phase="idle"] { display: none; }
  .ring { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ring circle { fill: none; stroke-width: 4; }
  .ring .track { stroke: rgba(255,255,255,0.18); }
  .ring .fill { stroke: currentColor; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .cue[data-phase="go"] .ring { display: none; }
  .cue .arrow-box { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .cue[data-move="push"] .arrow-box, .cue[data-move="pull"] .arrow-box { width: 53%; height: 62%; }
  .cue[data-move="pan_left"] .arrow-box, .cue[data-move="pan_right"] .arrow-box { width: 78%; height: 47%; }
  .cue[data-phase="ready"] .arrow-box { opacity: 0.45; }
  .cue[data-phase="go"] .arrow-box { filter: drop-shadow(0 0 6px var(--c)) drop-shadow(0 0 16px var(--c)); animation-duration: 0.7s; animation-timing-function: ease-out; animation-fill-mode: forwards; }
  .cue[data-phase="go"][data-move="push"] .arrow-box { animation-name: go-up; }
  .cue[data-phase="go"][data-move="pull"] .arrow-box { animation-name: go-down; }
  .cue[data-phase="go"][data-move="pan_left"] .arrow-box { animation-name: go-left; }
  .cue[data-phase="go"][data-move="pan_right"] .arrow-box { animation-name: go-right; }
  @keyframes go-up { to { transform: translate(-50%, -112%); } }
  @keyframes go-down { to { transform: translate(-50%, 4%); } }
  @keyframes go-left { to { transform: translate(-157%, -50%); } }
  @keyframes go-right { to { transform: translate(57%, -50%); } }
  .cue-word { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); font-size: 7cqh; line-height: 1.2; font-weight: 900; }
  .cue[data-phase="ready"] .cue-word { opacity: 0.5; }
  .cue[data-phase="go"] .cue-word { text-shadow: 0 0 8px var(--c), 0 0 20px var(--c); }
  .edge { position: absolute; background: var(--c); box-shadow: 0 0 30px 12px var(--c); opacity: 0; transition: opacity 250ms; pointer-events: none; }
  .edge.on { opacity: 1; transition: none; }
  .edge[data-side="top"] { left: 0; right: 0; top: 0; height: 6px; }
  .edge[data-side="bottom"] { left: 0; right: 0; bottom: 0; height: 6px; }
  .edge[data-side="left"] { top: 0; bottom: 0; left: 0; width: 6px; }
  .edge[data-side="right"] { top: 0; bottom: 0; right: 0; width: 6px; }
  .result { position: absolute; top: 10px; right: 26px; margin: 0; padding: 2px 14px; border-radius: 999px; font-size: 18px; font-weight: 900; border: 2px solid currentColor; }
  .result.good { color: #6FD39A; background: rgba(23,55,38,0.85); }
  .result.warn { color: #FFB061; background: rgba(58,42,22,0.85); }
  .result.bad { color: #FF8A7A; background: rgba(61,31,28,0.85); }
  .result.miss { color: #C4CAD4; background: rgba(38,43,51,0.85); }
  .you, .next { position: absolute; left: 10px; display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 12px; font-weight: 800; }
  .you { top: 10px; background: rgba(14,16,19,0.75); color: #FFFFFF; font-size: 15px; }
  .you .arrow-box { width: 26px; height: 26px; }
  .next { bottom: 10px; background: rgba(14,16,19,0.6); color: #C4CAD4; font-size: 13px; }
  .next .arrow-box { width: 22px; height: 22px; }
  .meter { position: absolute; right: 10px; top: 48px; bottom: 10px; width: 6px; border-radius: 3px; background: rgba(255,255,255,0.15); overflow: hidden; display: flex; align-items: flex-end; }
  .meter span { display: block; width: 100%; height: 0; background: rgba(255,255,255,0.8); border-radius: 3px; }
  .preroll { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: rgba(14,16,19,0.7); color: #FFFFFF; font-weight: 800; }
  .preroll b { font-size: 72px; line-height: 1; }
  .timeline { width: 100%; }
  .timeline canvas { width: 100%; height: 30px; display: block; }
  .timeline.big canvas { height: 56px; cursor: pointer; }
  .time-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 0 2px; }

  /* 成績 */
  .kinds { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; width: 100%; max-width: 560px; }
  .kind { padding: 8px 2px; border-radius: 12px; border: 2px solid currentColor; display: flex; flex-direction: column; align-items: center; font-weight: 800; }
  .kind b { font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kind span { font-size: 13px; }
  .kind.good { color: var(--good); background: var(--good-soft); } .kind.warn { color: var(--warn); background: var(--warn-soft); }
  .kind.bad { color: var(--bad); background: var(--bad-soft); } .kind.miss { color: var(--miss); background: var(--miss-soft); }
  .tend { font-size: 18px; font-weight: 800; }
  .detail { width: 100%; max-width: 560px; min-height: 76px; display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); text-align: left; }
  .detail .arrow-box { width: 44px; height: 44px; flex: none; }
  .detail .info { flex: 1 1 auto; display: flex; flex-direction: column; }
  .detail .info b { font-size: 17px; }
  .detail .info span { font-size: 14px; color: var(--muted); }
  .detail button { min-height: 44px; padding: 0 14px; }

  .overlay { position: fixed; inset: 0; background: rgba(10, 12, 16, 0.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .overlay .box { background: var(--panel); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 12px; align-items: stretch; min-width: 260px; }

  /* 橫拿手機（拍攝姿勢）：左邊影片（提示疊在上面），右邊分數與暫停；時間軸在下面 */
  @media (orientation: landscape) and (max-height: 560px) {
    main { justify-content: flex-start; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
    section { gap: 8px; }
    #run { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "stage top" "line top"; column-gap: 10px; row-gap: 4px; height: calc(100dvh - max(12px, env(safe-area-inset-top)) - max(12px, env(safe-area-inset-bottom))); }
    .stage { grid-area: stage; max-height: none; height: 100%; aspect-ratio: auto; }
    #run .topbar { grid-area: top; width: auto; height: 100%; flex-direction: column; justify-content: space-between; }
    #run .timeline { grid-area: line; }
    #run .icon-btn { width: 44px; min-width: 44px; min-height: 44px; }
    #run .score { font-size: 17px; text-align: center; }
    #run .score small { display: block; }
    .timeline canvas { height: 22px; }
    .counts .arrow-box { width: 40px; height: 40px; }
    .steps { display: none; }
    #start { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 24px; row-gap: 8px; align-items: center; justify-items: center; }
    #start > h1, #start > .song, #start > .counts { grid-column: 1; }
    #start > :not(h1):not(.song):not(.counts) { grid-column: 2; }
    #start > h1 { grid-row: 1; } #start > .song { grid-row: 2; } #start > .counts { grid-row: 3 / span 4; }
  }
</style>
</head>
<body>
<main>

<!-- 開始頁 -->
<section id="start">
  <h1>跟拍練習</h1>
  <p class="song" id="songName"></p>
  <div class="counts" id="counts" aria-label="這首歌要做的動作"></div>

  <div class="steps" aria-label="怎麼練">
    <div class="step"><span class="step-badge count">2</span><b>圈跑完</b><span>看要做哪個</span></div>
    <div class="step"><span class="step-badge go">動</span><b>箭頭亮就動</b><span>照箭頭方向</span></div>
    <div class="step"><span class="step-badge good">✓</span><b>看右上角</b><span>準、早、晚</span></div>
  </div>

  <div class="video-box">
    <label class="pick" id="pickBtn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3"></path></svg><span id="pickText">選練習影片</span><input type="file" id="videoFile" accept="video/*"></label>
    <p class="video-info" id="videoInfo" aria-live="polite"></p>
  </div>

  <div class="row" role="group" aria-label="練哪些動作" id="sizes">
    <button type="button" data-big="1" aria-pressed="true">只練大動作</button>
    <button type="button" data-big="0" aria-pressed="false">大小都練</button>
  </div>

  <div class="row">
    <button type="button" class="primary" id="startBtn">開始</button>
    <button type="button" class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="提示音"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path id="soundWave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"></path></svg></button>
  </div>
  <button type="button" class="link" id="noVideoBtn">沒有影片，只看提示練</button>
  <p class="muted" id="lastRun"></p>
  <p class="status" id="startStatus" aria-live="polite"></p>
  <p class="tip"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>Safari 分享鍵 →「加入主畫面」，從主畫面開會變全螢幕</p>
</section>

<!-- 練習中：影片（提示疊在上面）、整首時間軸 -->
<section id="run" hidden>
  <div class="topbar">
    <span class="score" id="score" aria-live="polite"></span>
    <button type="button" class="icon-btn" id="pauseBtn" aria-label="暫停"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></button>
  </div>
  <div class="stage" id="stage">
    <video id="video" playsinline webkit-playsinline preload="auto"></video>
    <div class="clock-face" id="clockFace" hidden></div>
    <div class="cue" id="cue" data-phase="idle" data-move="" aria-hidden="true">
      <svg class="ring" viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"></circle><circle class="fill" id="ringFill" cx="50" cy="50" r="42"></circle></svg>
      <div class="arrow-box" id="cueArrow"></div>
      <div class="cue-word" id="cueWord"></div>
    </div>
    <div class="edge" id="edge" data-side="top" aria-hidden="true"></div>
    <p class="result" id="result" hidden aria-live="polite"></p>
    <div class="you" id="you" hidden><div class="arrow-box" id="youArrow"></div><span id="youText"></span></div>
    <div class="next" id="nextBox" hidden><span>接著</span><div class="arrow-box" id="nextArrow"></div></div>
    <div class="meter" aria-hidden="true"><span id="meter"></span></div>
    <div class="preroll" id="preroll" hidden><b id="prerollNum">3</b><span>拿好手機</span></div>
  </div>
  <div class="timeline" aria-hidden="true"><canvas id="line"></canvas></div>
</section>


<!-- 成績 -->
<section id="summary" hidden>
  <h1 id="sumTitle"></h1>
  <p class="tend" id="sumTend"></p>
  <div class="kinds" id="kinds"></div>
  <div class="counts" id="byMove" aria-label="各動作準的次數"></div>
  <div class="timeline big">
    <canvas id="sumLine" aria-label="整首歌每個提示的結果，點一下看細節"></canvas>
    <div class="time-labels"><span>0:00</span><span id="sumEnd"></span></div>
  </div>
  <div class="detail" id="detail"><div class="arrow-box" id="detailPict"></div><div class="info"><b id="detailTitle">點時間軸上的點看細節</b><span id="detailSub"></span></div><button type="button" id="fromHereBtn" hidden>從這裡練</button></div>
  <div class="row">
    <button type="button" class="primary" id="againBtn">再練一次</button>
    <button type="button" id="homeBtn">回首頁</button>
  </div>
</section>

<div class="overlay" id="paused" hidden>
  <div class="box">
    <h1>暫停中</h1>
    <button type="button" class="primary" id="resumeBtn">繼續</button>
    <button type="button" id="back10Btn">倒退 10 秒</button>
    <button type="button" id="finishBtn">結束看成績</button>
  </div>
</div>

<div class="overlay" id="tapToPlay" hidden>
  <div class="box">
    <button type="button" class="primary" id="tapPlayBtn">▶ 點一下開始播放</button>
  </div>
</div>

</main>
<script src="js/judge.js?v=87005425"></script>
<script src="js/recorder.js?v=d4182f9d"></script>
<script src="js/pict.js?v=2a1556de"></script>
<script src="js/detect.js?v=499c35a7"></script>
<script src="js/practice.js?v=2e4851c0"></script>
<script src="js/songs.js?v=07a1a251"></script>
<script src="js/gyro_ui.js?v=e3bd90ca"></script>
</body>
</html>

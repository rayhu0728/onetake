<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="動作錄製">
<title>動作錄製</title>
<style>
  :root {
    --bg:#F4F5F7; --panel:#FFFFFF; --line:#D9DDE3; --text:#1B1E24; --muted:#4B5260;
    --accent:#1D4ED8; --on-accent:#FFFFFF; --accent-soft:#E3EAFB;
    --go:#1D4ED8; --good:#067647; --good-soft:#DDF3E6; --warn:#B54708; --warn-soft:#FDEBD3;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#14171C; --panel:#1E2229; --line:#333A44; --text:#E8EAEE; --muted:#A3ABB7;
    --accent:#7FA8FF; --on-accent:#0B1220; --accent-soft:#22304D;
    --go:#2F5FD0; --good:#6FD39A; --good-soft:#173726; --warn:#FFB061; --warn-soft:#3A2A16;
  } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  main { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  section { width: 100%; max-width: 760px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  h1 { margin: 0; font-size: 26px; line-height: 1.3; }
  p { margin: 0; }
  .lead { font-size: 16px; color: var(--muted); max-width: 30em; }
  .muted { color: var(--muted); font-size: 14px; }
  button { font: inherit; font-weight: 700; min-height: 52px; padding: 0 20px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-size: 19px; min-width: 180px; }
  button.link { border: none; background: none; color: var(--accent); min-height: 44px; }
  button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .status { min-height: 1.4em; font-size: 15px; color: var(--warn); }

  /* 俯視示意圖 */
  .pict { width: 100%; height: 100%; display: block; }
  .pict-floor { fill: none; stroke: var(--line); stroke-width: 3; stroke-dasharray: 4 8; }
  .pict-cone { fill: var(--accent); opacity: 0.2; }
  .pict-phone { fill: var(--accent); }
  .pict-head { fill: var(--muted); }
  .pict-body { fill: none; stroke: var(--muted); stroke-width: 9; stroke-linecap: round; }

  /* 開始頁 */
  .demo { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; width: 100%; }
  .demo figure { margin: 0; padding: 8px 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .demo .pict-box { width: 100%; max-width: 96px; aspect-ratio: 1 / 1; }
  .demo figcaption { font-size: 14px; font-weight: 700; }
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
  .step b { color: var(--text); font-size: 15px; }
  .step-badge { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; border: 3px solid var(--line); }
  .step-badge.go { background: var(--go); border-color: var(--go); color: #FFFFFF; }
  .step-badge.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .tip { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .tip svg { width: 20px; height: 20px; flex: none; }

  /* 錄製頁 */
  .topbar { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
  .chip .pict-box { width: 26px; height: 26px; }
  .pips { display: flex; gap: 3px; }
  .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .pip.on { background: var(--accent); }
  .icon-btn { width: 52px; min-width: 52px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn svg { width: 22px; height: 22px; }
  .run-body { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .card { position: relative; width: min(88vw, 38vh, 360px); width: min(88vw, 38dvh, 360px); aspect-ratio: 1 / 1; border-radius: 24px; background: var(--panel); border: 3px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 10px; transition: background-color 120ms, border-color 120ms; }
  .card .big { height: 52px; font-size: 44px; line-height: 52px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .card .pict-box { flex: 1 1 auto; width: 100%; min-height: 0; }
  .card .bar { position: absolute; left: 14px; right: 14px; bottom: 10px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .card .bar > span { display: block; height: 100%; width: 0; background: var(--accent); }
  .card[data-phase="go"] { background: var(--go); border-color: var(--go); color: #FFFFFF; }
  .card[data-phase="go"] .pict-cone { fill: #FFFFFF; opacity: 0.3; }
  .card[data-phase="go"] .pict-phone, .card[data-phase="go"] .pict-head { fill: #FFFFFF; }
  .card[data-phase="go"] .pict-body { stroke: #FFFFFF; }
  .card[data-phase="go"] .pict-floor { stroke: rgba(255,255,255,0.35); }
  .card[data-phase="go"] .bar > span { background: #FFFFFF; }
  .card[data-phase="ok"] { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .card[data-phase="retry"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .panel { width: min(88vw, 360px); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .move-name { font-size: 28px; font-weight: 800; line-height: 1.2; }
  .move-hint { font-size: 17px; color: var(--muted); }
  .trace-box { width: 100%; }
  .trace-box canvas { width: 100%; height: 72px; display: block; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
  .trace-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 2px 4px 0; }
  .feedback { min-height: 1.5em; font-size: 18px; font-weight: 800; }
  .feedback.ok { color: var(--good); }
  .feedback.retry { color: var(--warn); }

  /* 暫停 */
  .overlay { position: fixed; inset: 0; background: rgba(10, 12, 16, 0.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .overlay .box { background: var(--panel); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 12px; align-items: stretch; min-width: 260px; }

  /* 總覽 */
  .grid { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .grid-row { display: grid; grid-template-columns: 56px repeat(5, minmax(0, 1fr)); gap: 6px; align-items: center; }
  .grid-row .pict-box { width: 40px; height: 40px; margin: 0 auto; }
  .cell { min-height: 44px; padding: 4px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel); }
  .cell canvas { width: 100%; height: 32px; display: block; }
  .cell.retry { border-color: var(--warn); background: var(--warn-soft); }
  .cell.empty { border-style: dashed; }

  /* 橫拿手機 */
  @media (orientation: landscape) and (max-height: 560px) {
    main { justify-content: flex-start; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
    section { gap: 10px; }
    /* 錄製頁兩欄：左邊大卡片，右邊上面進度、下面名稱與活動線 */
    #run { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto 1fr; grid-template-areas: "card top" "card panel"; column-gap: 24px; row-gap: 6px; align-items: center; justify-items: center; max-width: 820px; }
    .run-body { display: contents; }
    #run .topbar { grid-area: top; }
    #run .card { grid-area: card; align-self: center; width: min(76vh, 290px); width: min(76dvh, 290px); padding: 6px; }
    #run .card .big { height: 40px; line-height: 40px; font-size: 34px; }
    #run .panel { grid-area: panel; width: 100%; max-width: 420px; gap: 4px; }
    .move-name { font-size: 22px; }
    .move-hint { font-size: 15px; }
    .trace-box canvas { height: 52px; }
    .chip { padding: 2px 6px; }
    .chip .pict-box { width: 22px; height: 22px; }
    .demo .pict-box { max-width: 64px; }
    .grid-row { grid-template-columns: 44px repeat(5, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<main>

<!-- 開始頁：說明為什麼錄、示範五種動作、怎麼錄 -->
<section id="start">
  <h1>動作錄製</h1>
  <p class="lead">錄下你拿手機推、拉、搖的樣子。之後的練習會用這些資料，判斷你的動作方向對不對、早還是晚。</p>

  <div class="demo" id="demo" aria-label="五種動作示範"></div>

  <div class="steps" aria-label="怎麼錄">
    <div class="step"><span class="step-badge">3</span><b>倒數時拿穩</b><span>看示範，先別動</span></div>
    <div class="step"><span class="step-badge go">嗶</span><b>變藍就動</b><span>做一次就停住</span></div>
    <div class="step"><span class="step-badge good">✓</span><b>看線有沒有跳</b><span>沒跳就重做</span></div>
  </div>

  <div class="row" role="group" aria-label="握法" id="grips">
    <button type="button" data-grip="手持" aria-pressed="true">手持</button>
    <button type="button" data-grip="夾雲台" aria-pressed="false">夾雲台</button>
  </div>

  <div class="row">
    <button type="button" class="primary" id="practiceBtn">先試一次</button>
    <button type="button" id="startBtn">直接開始（25 個）</button>
  </div>
  <button type="button" class="link" id="resumeBtn" hidden>接續上次</button>
  <p class="status" id="startStatus" aria-live="polite"></p>
  <p class="tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>畫面太小？Safari 分享鍵 →「加入主畫面」，從主畫面開會變全螢幕</p>
</section>

<!-- 錄製頁 -->
<section id="run" hidden>
  <div class="topbar">
    <div class="chips" id="chips" aria-label="進度"></div>
    <button type="button" class="icon-btn" id="pauseBtn" aria-label="暫停"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></button>
  </div>
  <div class="run-body">
    <div class="card" id="card" data-phase="ready">
      <div class="big" id="big" aria-live="assertive"></div>
      <div class="pict-box" id="pictBox"></div>
      <div class="bar" aria-hidden="true"><span id="bar"></span></div>
    </div>
    <div class="panel">
      <p class="move-name" id="moveName"></p>
      <p class="move-hint" id="moveHint"></p>
      <div class="trace-box">
        <canvas id="trace" aria-label="你的動作活動量"></canvas>
        <div class="trace-legend"><span>拿穩</span><span>嗶 → 做動作</span></div>
      </div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <div class="row" id="retryActions" hidden>
        <button type="button" class="primary" id="redoBtn">重做這一個</button>
        <button type="button" id="skipBtn">下一個</button>
      </div>
      <div class="row" id="practiceActions" hidden>
        <button type="button" class="primary" id="goRealBtn">開始正式錄</button>
        <button type="button" id="practiceAgainBtn">再試一次</button>
      </div>
    </div>
  </div>
</section>

<!-- 總覽：每格是一個動作的活動線，點格子重錄 -->
<section id="summary" hidden>
  <h1 id="sumTitle">錄好了</h1>
  <p class="muted">每格是一次動作的活動線。琥珀色的是沒偵測到動作，點任何一格可以重錄那一個。</p>
  <div class="grid" id="grid"></div>
  <div class="row">
    <button type="button" class="primary" id="shareBtn">傳到電腦</button>
    <button type="button" id="saveBtn">存到檔案</button>
  </div>
  <p class="muted" id="saveHint">「傳到電腦」可以選 LINE、Gmail 或 Google 雲端硬碟，傳給自己。</p>
  <button type="button" class="link" id="againBtn">清掉重錄一輪</button>
  <p class="status" id="sumStatus" aria-live="polite"></p>
</section>

<div class="overlay" id="paused" hidden>
  <div class="box">
    <h1>暫停中</h1>
    <button type="button" class="primary" id="resumeRunBtn">繼續</button>
    <button type="button" id="undoBtn">重錄上一個</button>
  </div>
</div>

</main>
<script src="js/recorder.js?v=d4182f9d"></script>
<script src="js/recorder_ui.js?v=3ad66154"></script>
</body>
</html>
